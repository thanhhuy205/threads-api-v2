packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  '@bufbuild/buf': false
  "@google/genai": true
  "@openrouter/sdk": true
  '@parcel/watcher': false
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": true
  '@swc/core': false
  bcrypt: true
  cpu-features: false
  esbuild: true
  ffmpeg-ffprobe-static: true
  ffmpeg-static: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true
