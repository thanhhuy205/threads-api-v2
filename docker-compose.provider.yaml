services:
  mysql:
    image: mysql:8.4
    container_name: threads-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - purse-network
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"
  kong:
    image: kong:3.7
    container_name: pulse-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong-dev.yaml
      KONG_PLUGINS: bundled,auth-context
      KONG_LUA_PACKAGE_PATH: /kong/plugins/?.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Admin API stays bound to loopback via the published port below.
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
      # Enables {vault://env/...} references in kong-dev.yaml.
      KONG_VAULTS: env
      # Resolves {vault://env/kong-jwt-secret}. Must match the app's JWT_SECRET,
      # otherwise Kong verifies signatures against the wrong key and every
      # authenticated request 401s.
      KONG_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000" # proxy — the only public entrypoint
      - "127.0.0.1:8001:8001" # admin API — loopback only
    volumes:
      - ./apps/config/kong:/kong:ro
    depends_on:
      - auth-service
    networks:
      - purse-network

  # Both services are reachable only from inside the compose network: they trust
  # X-JWT-CLAIMS unconditionally, so publishing a host port would let anyone set
  # that header and impersonate any user. Use `expose`, never `ports`.
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      args:
        SERVICE: auth-service
    container_name: pulse-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3300
      MICROSERVICE_NAME: AuthService
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3300"
      - "5001"
    depends_on:
      - mysql
      - redis
    networks:
      - purse-network

  workspace-service:
    build:
      context: .
      dockerfile: apps/workspace-service/ Dockerfile
      args:
        SERVICE: workspace-service
    container_name: pulse-workspace-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKSPACE_SERVICE_HOST: 0.0.0.0
      WORKSPACE_SERVICE_PORT: 3301
      MICROSERVICE_NAME: WorkspaceService
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3301"
    depends_on:
      - mysql
      - redis
    networks:
      - purse-network

  backup:
    build: ./backup
    container_name: threads-backup
    restart: unless-stopped
    depends_on:
      - mysql
    volumes:
      - ./docker/rclone:/config/rclone
      - ./docker/backup:/backup
    entrypoint: /bin/sh

    command: |
      -c "
      echo 'MySQL is ready.'
      until mysqladmin ping -h mysql -u root -p$$DB_ROOT_PASSWORD --silent; do
          echo 'MySQL not ready, waiting...'
          sleep 5
      done
      while true; do
          DUMP_FILE=/backup/dump_$$(date +%Y%m%d_%H%M%S).sql
          mysqldump -h mysql -u root -p$$DB_ROOT_PASSWORD $$DB_NAME > $$DUMP_FILE
          test -s $$DUMP_FILE && rclone copy /backup gdrive:threads-backups/mysql --config /config/rclone/rclone.conf || echo 'Backup failed.'
          rm -f /backup/*.sql
          sleep 30
      done
      "
    environment:
      DB_ROOT_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - purse-network
  nginx:
    image: nginx:alpine
    container_name: threads-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/conf.d/cert.pem
      - ./nginx/certs:/etc/nginx/conf.d/key.pem
    restart: unless-stopped
    networks:
      - purse-network

  soketi:
    image: quay.io/soketi/soketi:1.6.1-16-alpine
    container_name: threads-soketi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_SECRET}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
    ports:
      - "6001:6001"
    networks:
      - purse-network

  redis:
    image: redis:8.6.2-alpine
    container_name: threads-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/redis-data:/data
    restart: unless-stopped
    networks:
      - purse-network

  redis-insight:
    image: redislabs/redisinsight:3.4
    container_name: threads-redis-insight
    ports:
      - "5540:5540"
    restart: unless-stopped
    networks:
      - purse-network

  mongodb:
    image: mongo:7.0
    container_name: threads-mongodb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_NAME}
    volumes:
      - ./docker/mongodb-data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    networks:
      - purse-network

volumes:
  redis-data:
  mysql-data:
  mongodb-data:

networks:
  purse-network:
