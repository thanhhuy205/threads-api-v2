services:
  apisix:
    ports:
      - "9080:9080"

  keycloak:
    command: start-dev
    environment:
      KC_HOSTNAME: http://localhost:18081
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:18081:8080"
  keycloak-db:
    ports:
      - "5595:5432"
