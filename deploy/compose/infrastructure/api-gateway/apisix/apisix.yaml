routes:
  - id: auth-route
    uri: /auth/*
    name: auth-service-route
    upstream:
      type: roundrobin
      nodes:
        "auth-service:3001": 1

  - id: account-route
    uri: /account/*
    name: account-service-route
    upstream:
      type: roundrobin
      nodes:
        "account-service:3002": 1

#END
