syntax = "proto3";

package user;

service UserService {
  rpc FindExistingIds(FindExistingIdsRequest) returns (FindExistingIdsResponse);
  rpc GetUser(GetUserRequest) returns (UserResponse);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
  rpc FindByUserId(FindByUserIdRequest) returns (FindByUserIdResponse);
  rpc FindByUsername(FindByUsernameRequest) returns (FindByUsernameResponse);
}


message FindByUsernameRequest {
  string username = 1;
}
message FindByUserIdRequest {
  string user_id = 1;
}

message FindByUserIdResponse {
  string id = 1;
  string username = 2;
}

message FindByUsernameResponse {
  string id = 1;
  string username = 2;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message FindExistingIdsRequest {
  repeated string user_ids = 1;
}

message FindExistingIdsResponse {
  repeated string user_ids = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string name = 4;
  string role = 5;
  bool is_active = 6;
}