_format_version: "3.0"

services:
  - name: user-service
    enabled: true
    host: host.docker.internal # đổi đúng tên container/host thật trong docker-compose
    port: 3300
    path: /
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    routes:
      # Public routes are declared explicitly so they can re-declare `jwt` with
      # an anonymous consumer (a request with no token still reaches the app,
      # which then decides via @IsPublic()).
      #
      # Auth uses the same /api/v1 prefix at Kong and in the Nest application,
      # so Kong forwards the URI unchanged.
      - name: user-service-catchall
        paths: [/api/v1/user]
        strip_path: false
        regex_priority: 1
        tags: [user]

  - name: post-service
    enabled: true # jwt
    host: host.docker.internal # post-service runs locally in dev
    port: 3302
    path: /
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000 # max 60s, if > 60s -> 504 Gateway Timeout
    write_timeout: 60000
    retries: 5 # retry 5 if request failed
    routes:
      - name: post-service-catchall
        paths: [/api/v1/posts]
        strip_path: false
        regex_priority: 0
        tags: [post-service]
        # not set plugins because use jwt global
      - name: post-keycloak-me
        paths: [/api/v1/posts/keycloak-me]
        strip_path: false
        tags: [post-service, keycloak-test]
        plugins:
          - name: jwt
            config:
              anonymous: anonymousConsumer
              claims_to_verify: [exp]
              header_names: [authorization]
              key_claim_name: iss
              uri_param_names: []
