_format_version: "3.0"

consumers:
  - custom_id: auth-service
    username: auth-service
    jwt_secrets:
      - algorithm: HS256
        key: auth-service # phải khớp claim "iss" trong token do auth-service ký
        secret: ${JWT_SECRET}
  - custom_id: anonymousConsumer
    username: anonymousConsumer

plugins:
  - name: jwt
    instance_name: global_jwt_auth
    enabled: true
    protocols: [grpc, grpcs, http, https]
    config:
      claims_to_verify: [exp]
      header_names: [authorization]
      key_claim_name: iss
      maximum_expiration: 0
      run_on_preflight: true
      secret_is_base64: false
      uri_param_names: [jwt]

  - name: request-transformer
    instance_name: transform_jwt_claims
    enabled: true
    protocols: [grpc, grpcs, http, https]
    config:
      add:
        headers:
          - "X-JWT-CLAIMS: $(jwt_claims)"

services:
  - name: auth-service
    enabled: true
    host: auth-service # đổi đúng tên container/host thật trong docker-compose
    port: 3300
    path: /
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    routes:
      - name: auth-swagger
        paths: [/auth-service/swagger]
        strip_path: false
        regex_priority: 100
        plugins:
          - name: jwt
            config:
              {
                anonymous: anonymousConsumer,
                claims_to_verify: [exp],
                header_names: [authorization],
                key_claim_name: iss,
                uri_param_names: [jwt],
              }
          - name: request-transformer
            config: { replace: { uri: /swagger } }

      - name: auth-login
        paths: [/auth-service/api/auth/login]
        strip_path: false
        regex_priority: 100
        plugins:
          - name: jwt
            config:
              {
                anonymous: anonymousConsumer,
                claims_to_verify: [exp],
                header_names: [authorization],
                key_claim_name: iss,
                uri_param_names: [jwt],
              }
          - name: request-transformer
            config: { replace: { uri: /api/auth/login } }

      - name: auth-sign-up
        paths: [/auth-service/api/auth/sign-up]
        strip_path: false
        regex_priority: 100
        plugins:
          - name: jwt
            config:
              {
                anonymous: anonymousConsumer,
                claims_to_verify: [exp],
                header_names: [authorization],
                key_claim_name: iss,
                uri_param_names: [jwt],
              }
          - name: request-transformer
            config: { replace: { uri: /api/auth/sign-up } }

      - name: auth-service-catchall
        paths: [/auth-service]
        strip_path: true
        regex_priority: 1
        tags: [auth]
        # không gắn plugin riêng -> dùng plugin jwt global -> bắt buộc JWT hợp lệ

  - name: user-service
    enabled: true
    host: user-service # đổi đúng tên container/host thật
    port: 3301
    path: /
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    routes:
      - name: user-service-catchall
        paths: [/user-service]
        strip_path: true
        regex_priority: 0
        tags: [user-service]
        # không gắn plugin riêng -> dùng plugin jwt global -> bắt buộc JWT hợp lệ
