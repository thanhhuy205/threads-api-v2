name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - production
      - dev

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image URI
        id: set-image
        run: echo "uri=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect pushed image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Echo image URI
        run: echo "Built and pushed ${{ steps.set-image.outputs.uri }}"

      - name: Create production release
        if: github.ref == 'refs/heads/production'
        uses: ncipollo/release-action@v1
        with:
          tag: production
          name: Production Release
          body: "Release for commit ${{ github.sha }}"
          allowUpdates: true

      - name: Create dev release
        if: github.ref == 'refs/heads/dev'
        uses: ncipollo/release-action@v1
        with:
          tag: dev
          name: Dev Release
          body: "Release for commit ${{ github.sha }}"
          allowUpdates: true

  deploy:
    needs: build
    runs-on: self-hosted
    environment: production
    if: github.ref == 'refs/heads/production'

    steps:
      - name: Login to GHCR
        run: |
          echo ${{ github.token }} | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > /home/ubuntu/.env

      - name: Pull image
        run: docker pull ${{ needs.build.outputs.image }}
